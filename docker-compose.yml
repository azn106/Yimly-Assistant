services:
  yimly_home:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yimly_home
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=production
      - DATA_DIR=/data
      - DATABASE_URL=sqlite+aiosqlite:////data/ha_server.db
      - UPLOADS_DIR=/data/uploads
      - PORT=3000
    volumes:
      - yimly_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/config || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudflared_bridge

volumes:
  yimly_data:
    driver: local

networks:
  cloudflared_bridge:
    external: true
