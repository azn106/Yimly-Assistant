<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MapLibre OpenFreeMap Minimal Test</title>
  <link href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.85); color: #22c55e; padding: 12px; font-family: monospace; font-size: 13px; border-radius: 6px; max-width: 90%; }
  </style>
</head>
<body>
  <div id="info">Initializing MapLibre GL JS v5.13.0...</div>
  <div id="map"></div>

  <script>
    const infoEl = document.getElementById('info');
    function log(msg, color='#22c55e') {
      infoEl.innerHTML += `<div style="color:${color}">${msg}</div>`;
      console.log(msg);
    }

    try {
      log('MapLibre version: ' + maplibregl.version);
      
      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/positron',
        center: [13.388, 52.517], // Berlin
        zoom: 12
      });

      map.on('error', (e) => {
        log('MapLibre Error: ' + (e.error ? e.error.message : JSON.stringify(e)), '#ef4444');
      });

      map.on('load', () => {
        log('MAP LOADED SUCCESSFULLY! Features & vector tiles parsed.', '#38bdf8');
      });

      map.on('styledata', () => {
        log('Style data updated. isStyleLoaded: ' + map.isStyleLoaded());
      });
    } catch (e) {
      log('Fatal Error: ' + e.message, '#ef4444');
    }
  </script>
</body>
</html>
